# KarkasCRM за существующим nginx (когда 80/443 уже заняты другим сайтом).
# Сервер CRM слушает только localhost: CRM_BIND=127.0.0.1, CRM_PORT=8080.
# Файл — пример для /etc/nginx/sites-available/crm.conf, затем:
#   ln -s /etc/nginx/sites-available/crm.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Сертификат: certbot --nginx -d crm.example.com (порт 80 уже открыт вашим nginx).

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;   # замените на свой домен

    # Письма и ответы могут быть большими; вложения из чата — до 15 МБ (base64 ≈ 20 МБ)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        # Реальный IP клиента: по нему считаются лимиты входа и вебхуков.
        # $proxy_add_x_forwarded_for дописывает настоящий адрес в конец —
        # подделать его из браузера нельзя.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Живые события чатов (SSE) не должны обрываться прокси
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Если сертификат уже получен, добавьте такой же server с:
#   listen 443 ssl http2;
#   ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
# и редирект с 80 на 443, а этот блок оставьте только для ACME-проверки.
