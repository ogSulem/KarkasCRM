server {
    listen 80;
    server_name crm.example.com;   # замените на свой домен или IP
    # необязательно: редирект на HTTPS, если сертификат поставлен отдельно (certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;   # при запуске через docker compose — порт CRM_PORT из .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; # важно для SSE-реалтайма чатов
    }
}
