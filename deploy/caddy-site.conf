# KarkasCRM за существующим Caddy (когда 80/443 уже заняты другим сайтом).
# Сервер CRM слушает только localhost: CRM_BIND=127.0.0.1, CRM_PORT=8080.
#
# Блок дописывается в Caddyfile отдельным сайтом. Существующие сайты не меняются:
# Caddy выбирает сайт по заголовку Host, поэтому поддомен просто добавляется рядом.
# Применять через reload, а не restart — reload не рвёт текущие соединения:
#   caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#   caddy reload   --config /etc/caddy/Caddyfile --adapter caddyfile
# Сертификат Let's Encrypt Caddy получит сам и сам добавит редирект с http на https.
# Для ACME домен должен уже указывать на этот сервер, а порты 80 и 443 — быть открыты.

crm.example.com {
    encode zstd gzip

    # Вложения из чата — до 15 МБ, в base64 это около 20 МБ
    request_body {
        max_size 25MB
    }

    header -Server

    reverse_proxy 127.0.0.1:8080 {
        # Живые события чатов (SSE) буферизовать нельзя: без немедленной отправки
        # новые сообщения придут пачкой уже после закрытия соединения
        flush_interval -1
        transport http {
            dial_timeout 10s
            read_timeout 3600s
            write_timeout 3600s
        }
    }
}

# Заголовки безопасности задаёт само приложение: Content-Security-Policy,
# X-Content-Type-Options, X-Frame-Options и HSTS. HSTS включается, когда
# приложение видит X-Forwarded-Proto: https — Caddy проставляет его по умолчанию.
# Дублировать эти заголовки в Caddyfile не нужно.

# ── Если Caddy сам работает в контейнере ─────────────────────────────────────
# 127.0.0.1 внутри контейнера — это сам контейнер, а не сервер, поэтому прокси
# не найдёт CRM. Подключите Caddy к сети проекта CRM и обращайтесь по имени
# контейнера (имя задаёт container_name в docker-compose.yml):
#
#   docker network connect karkascrm_default <имя контейнера caddy>
#   в блоке выше:  reverse_proxy karkascrm:8080 { ... }
#
# Проверить, что оба контейнера в одной сети:
#   docker network inspect karkascrm_default --format '{{range .Containers}}{{.Name}} {{end}}'
#
# Порт 8080 наружу при этом не открывается: публикация остаётся на 127.0.0.1,
# а трафик между контейнерами идёт во внутренний порт по общей сети.
# После docker compose down сеть удаляется вместе с подключением — команду
# network connect придётся повторить. Обычные up -d и restart этого не требуют.
