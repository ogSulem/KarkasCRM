<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KarkasCRM — CRM как amoCRM + Wazzup</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login hidden"><form id="loginForm" class="login-card"><div class="logo big">K<span>◆</span></div><h1>KarkasCRM</h1><p>Сделки, клиенты, задачи и все чаты Wazzup — в одном окне</p><label>E-mail<input name="email" type="email" value="admin@example.com" required></label><label>Пароль<input name="password" type="password" value="admin12345" required></label><button class="btn primary w">Войти →</button><small>Демо-доступ предзаполнен. Смените в .env перед продакшеном.</small><div class="err" id="loginErr"></div></form></div>
<div id="app" class="layout hidden"><aside><div class="brand"><div class="logo">K<span>◆</span></div><div><b>Karkas</b><span>CRM</span></div></div>
<nav id="nav"><button data-view="dashboard" class="active">◈ Дашборд</button><button data-view="pipe">▦ Сделки <span class="pill" id="navDeals"></span></button><button data-view="inbox">✉ Чаты Wazzup <span class="pill orange" id="navUnread"></span></button><button data-view="contacts">◎ Контакты</button><button data-view="companies">🏢 Компании</button><button data-view="tasks">✓ Задачи <span class="pill" id="navTasks"></span></button><button data-view="products">📦 Товары</button><button data-view="analytics">📊 Аналитика</button><button data-view="settings">⚙ Настройки</button></nav>
<div class="side-card"><b>Wazzup не подключён?</b><p>Настройки → Интеграции: вставьте API-ключ, синхронизируйте каналы — и все WhatsApp/Telegram-чаты будут здесь.</p><button class="btn orange w" onclick="go('settings','integrations')">Подключить Wazzup</button></div>
<div class="user"><div class="avatar" id="uAva">А</div><div><b id="uName"></b><small id="uEmail"></small></div><button id="logout">↪</button></div></aside>
<main><header><div><h2 id="title">Дашборд</h2><p id="subtitle"></p></div><div class="head-actions"><div class="searchbox"><input id="globalSearch" placeholder="🔍 Поиск: контакт, сделка, компания…"><div id="searchResults" class="search-results hidden"></div></div><button class="btn orange" onclick="openDeal()">+ Сделка</button><button class="btn primary" onclick="openContact()">+ Контакт</button><button class="btn" onclick="openTask()">+ Задача</button><button class="btn" title="Уведомления" onclick="openNotifications()">🔔<span class="pill orange" id="bellCount" style="margin-left:4px"></span></button></div></header><section id="view"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div id="toast"></div><script src="/app.js"></script></body></html>
