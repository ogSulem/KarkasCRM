<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KarkasCRM — каркасные дома и клиенты</title><meta name="description" content="Современная CRM: сделки, контакты, объединённые чаты WhatsApp и Telegram"><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login hidden"><form id="loginForm" class="login-card"><div class="logo big">K<span>◆</span></div><h1>KarkasCRM</h1><p>Сделки, клиенты и все чаты — в одном окне</p><label>E-mail<input name="email" type="email" value="admin@example.com" required></label><label>Пароль<input name="password" type="password" value="admin12345" required></label><button class="btn primary w">Войти →</button><small>Демо-доступ предзаполнен. Смените пароль в .env перед продакшеном.</small><div class="err" id="loginErr"></div></form></div>
<div id="app" class="layout hidden">
<aside><div class="brand"><div class="logo">K<span>◆</span></div><div><b>Karkas</b><span>CRM</span></div></div>
<nav id="nav">
<button data-view="dashboard" class="active">◈&nbsp; Дашборд</button>
<button data-view="pipe">▦&nbsp; Сделки <span class="pill" id="navDeals"></span></button>
<button data-view="inbox">✉&nbsp; Чаты <span class="pill orange" id="navUnread"></span></button>
<button data-view="contacts">◎&nbsp; Контакты</button>
<button data-view="tasks">✓&nbsp; Задачи <span class="pill" id="navTasks"></span></button>
<button data-view="settings">⚙&nbsp; Интеграции</button>
</nav><div class="side-card"><b>WhatsApp подключён?</b><p>Настройте Cloud API в разделе «Интеграции» — или тестируйте симулятором чата.</p><button class="btn orange w" onclick="go('settings')">Подключить</button></div><div class="user"><div class="avatar">А</div><div><b id="uName">Администратор</b><small id="uEmail"></small></div><button id="logout" title="Выйти">↪</button></div></aside>
<main><header><div><h2 id="title">Дашборд</h2><p id="subtitle">Обзор продаж сегодня</p></div><div class="head-actions"><input id="globalSearch" placeholder="🔍 Поиск контакта, сделки…"><button class="btn orange" onclick="openDeal()">+ Сделка</button><button class="btn primary" onclick="openContact()">+ Контакт</button></div></header>
<section id="view"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div id="toast"></div>
<script src="/app.js"></script></body></html>
