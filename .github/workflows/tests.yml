name: KarkasCRM — тесты

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Интеграционные тесты и проверка синтаксиса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'

      - name: Проверка синтаксиса
        run: |
          node --check backend/src/server.js
          node --check backend/src/competitors.js
          node --check backend/src/smtp.js
          node --check frontend/public/app.js

      - name: Интеграционные тесты (API и конкуренты)
        run: node --experimental-sqlite --test tests/api.test.js tests/competitors.test.js

      - name: Тест миграций базы данных
        run: node --experimental-sqlite tests/migrate.test.mjs
