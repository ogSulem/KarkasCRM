name: КаркасCRM — проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Один и тот же коммит не должен гонять проверки дважды: в ветке pull_request
# достаточно самого pull_request, а push оставлен только для main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Синтаксис, API, миграции базы и интерфейс
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'

      - name: Проверка синтаксиса
        run: |
          node --check backend/src/server.js
          node --check backend/src/competitors.js
          node --check backend/src/smtp.js
          node --check frontend/public/app.js
          node --check tests/api.test.js
          node --check tests/competitors.test.js
          node --check tests/timezone.test.js
          node --check tests/install-args.test.mjs
          node --check tests/update-mode.test.mjs
          node --check tests/wazzup-contract.test.mjs
          node --check tests/mail.test.mjs
          node --check tests/ui.smoke.mjs
          node --check tests/migrate.test.mjs
          node --check tests/routes.test.mjs
          for sh in install.sh run-local.sh run-tests.sh scripts/update.sh scripts/pack.sh deploy/start-caddy.sh; do bash -n "$sh"; done

      - name: Интеграционные тесты (API и конкуренты)
        run: node --experimental-sqlite --test tests/api.test.js tests/competitors.test.js

      # Мок отвечает так, как описано в документации Wazzup: каналы голым массивом,
      # при регистрации вебхука приходит проверочный POST и требуется ответ 200.
      - name: Контракт Wazzup — сверка с документацией вендора
        run: node --experimental-sqlite --test tests/wazzup-contract.test.mjs

      # Письмо уходит на подставной SMTP-сервер: проверяются и простой текст,
      # и структура вложения, и ссылка на документ, которая открывается без входа.
      - name: Почта — отправка, вложения и ссылка на документ
        run: node --experimental-sqlite --test tests/mail.test.mjs

      - name: Маршруты API — интерфейс не ходит в никуда
        run: node --test tests/routes.test.mjs

      # Пояс задан явно. CI работает в UTC, где datetime('now','localtime')
      # совпадает с datetime('now'), и расхождение осталось бы незамеченным.
      - name: Часовой пояс — отметки времени в UTC, месяц выручки местный
        run: TZ=Europe/Moscow node --experimental-sqlite --test tests/timezone.test.js

      - name: Аргументы установщика разбираются без docker
        run: node --test tests/install-args.test.mjs

      # Профиль tls поднимает Caddy на 80/443. Включить его при обновлении там,
      # где порты заняты чужим сайтом, значит уронить этот сайт.
      - name: Режим обновления выбирается по отметке, а не по домену
        run: node --test tests/update-mode.test.mjs

      - name: Тест миграций базы данных
        run: |
          node --experimental-sqlite tests/migrate.test.mjs
          node --experimental-sqlite tests/seed.test.mjs

      # Установка отделена от самого теста намеренно: раньше они были одним шагом,
      # и сбой npm выглядел в отчёте как «интерфейс сломался».
      - name: Установка jsdom для smoke-теста
        run: |
          for i in 1 2 3; do
            npm i --prefix /tmp/jsdomtest jsdom && break
            echo "Попытка $i не удалась — повторяю"; sleep 5
          done
          test -f /tmp/jsdomtest/node_modules/jsdom/lib/api.js

      - name: Smoke-тест интерфейса (jsdom)
        run: JSDOM_PATH=/tmp/jsdomtest/node_modules/jsdom/lib/api.js node --experimental-sqlite tests/ui.smoke.mjs

  docker:
    name: Docker без .env и проверка TLS-конфигурации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Локальный старт без домена
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/logo.png -o /tmp/logo.jpg
          cmp logo.jpg /tmp/logo.jpg
      - name: Домен передаётся приложению (иначе прод стартовал бы с демо-данными)
        run: |
          CRM_DOMAIN=crm.example.com docker compose config | grep -q 'CRM_DOMAIN: crm.example.com'
      - name: Образ — права, логотип и данные после перезапуска
        run: node tests/docker-smoke.mjs
      - name: TLS без домена отклоняется при запуске, не при разборе Compose
        run: |
          docker compose --profile tls config --quiet
          if docker compose --profile tls run --rm --no-deps caddy; then
            echo 'Ошибка: TLS без домена разрешён'; exit 1
          fi
      - name: Логи контейнеров при сбое
        if: failure()
        run: docker compose logs --no-color --tail 120
      - name: Синтаксис Caddy с доменом
        run: docker run --rm -e CRM_DOMAIN=crm.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine caddy adapt --config /etc/caddy/Caddyfile --validate
      # Пример для режима «рядом с чужим сайтом» пользователь вставляет в свой
      # Caddyfile как есть: битый сниппет роняет его веб-сервер вместе с сайтами.
      - name: Синтаксис примера Caddy для чужого края
        run: docker run --rm -v "$PWD/deploy/caddy-site.conf:/etc/caddy/site.caddy:ro" caddy:2.11-alpine caddy adapt --config /etc/caddy/site.caddy --adapter caddyfile
      - name: Остановка
        if: always()
        run: docker compose --profile tls down -v
