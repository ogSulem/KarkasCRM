name: karkascrm
# Значения подставляются из .env в этой же папке (см. .env.example).
# Запуск: docker compose up -d --build   →   http://IP:${CRM_PORT}
services:
  crm:
    build: .
    image: karkascrm:latest
    container_name: karkascrm
    restart: unless-stopped
    ports:
      # Оставьте так для быстрого старта. За HTTPS-прокси (Caddy/nginx) замените на "127.0.0.1:8080:8080"
      - "${CRM_PORT:-8080}:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Moscow}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # Wazzup (WhatsApp, Telegram, Instagram, Viber)
      WAZZUP_API_KEY: ${WAZZUP_API_KEY:-}
      WAZZUP_CHANNEL_ID: ${WAZZUP_CHANNEL_ID:-}
      WAZZUP_WEBHOOK_SECRET: ${WAZZUP_WEBHOOK_SECRET:-}
      WAZZUP_API_URL: ${WAZZUP_API_URL:-https://api.wazzup24.com/v3}
      # Прямой WhatsApp Cloud API (Meta) — альтернатива Wazzup
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-karkas-verify}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Вкладка «Конкуренты» (можно задать в интерфейсе: Настройки → Конкуренты и источники)
      FNS_API_KEY: ${FNS_API_KEY:-}
      FSSP_TOKEN: ${FSSP_TOKEN:-}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY:-}
      TWOGIS_KEY: ${TWOGIS_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
    volumes:
      - crm_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  crm_data:
    name: karkascrm_data
