name: karkascrm
# Значения подставляются из .env в этой же папке (см. .env.example).
# Запуск: docker compose up -d --build   →   http://IP:${CRM_PORT}
services:
  crm:
    build: .
    image: karkascrm:latest
    container_name: karkascrm
    restart: unless-stopped
    ports:
      # Локально: http://localhost:${CRM_PORT}. На сервере с доменом (профиль tls) поставьте CRM_BIND=127.0.0.1,
      # чтобы CRM была доступна только через Caddy с HTTPS.
      - "${CRM_BIND:-127.0.0.1}:${CRM_PORT:-8080}:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Moscow}
      # Начальные данные: demo (примеры) / base (правовая основа) / off (пусто).
      # Пусто = авто: с доменом — base, без домена — demo.
      SEED_MODE: ${SEED_MODE:-}
      # Домен нужен приложению, чтобы авто-режим правильно выбирал base вместо demo
      # (и чтобы в логах/письмах было видно, для какого адреса развёрнута CRM).
      CRM_DOMAIN: ${CRM_DOMAIN:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-chars}
      # Необязательно: свой файл логотипа, смонтированный в контейнер (иначе —
      # логотип из комплекта или загруженный в интерфейсе в томе /data/logo).
      LOGO_FILE: ${LOGO_FILE:-}
      # Публичный адрес для ссылок и вебхуков (можно задать и в интерфейсе:
      # Настройки → Интеграции → Адрес CRM в интернете). Пусто — из CRM_DOMAIN/браузера.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # 1 — разрешить проверке конкурентов локальные адреса (только для тестов/шлюзов)
      ALLOW_PRIVATE_FETCH: ${ALLOW_PRIVATE_FETCH:-}
      # 1 — не создавать начальные данные (совсем пустая база)
      KARKAS_NO_SEED: ${KARKAS_NO_SEED:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # Wazzup — один ключ на WhatsApp, Telegram, Instagram и Viber
      WAZZUP_API_KEY: ${WAZZUP_API_KEY:-}
      WAZZUP_WEBHOOK_SECRET: ${WAZZUP_WEBHOOK_SECRET:-}
      # Ключи источников для «Конкурентов» задаются в интерфейсе:
      # Настройки → Конкуренты и источники (в .env не нужны)
      # Почта: письма клиентам из CRM (то же самое в интерфейсе: Настройки → Интеграции)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      # Резервные копии в объектное хранилище (S3): команда выгрузки из cron —
      #   docker compose exec -T crm node scripts/upload-backup.mjs
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-karkascrm}
    volumes:
      - crm_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ── устойчивость и безопасность ────────────────────────────────────────
    init: true                      # корректная обработка сигналов и «сирот» от healthcheck
    read_only: true                 # код приложения неизменяем, данные — только в томе /data
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s          # сервер успевает дописать WAL и закрыть базу
    logging:
      driver: json-file
      options:
        max-size: "10m"             # логи не растут бесконечно и не забивают диск
        max-file: "3"

  # ── HTTPS и домен: docker compose --profile tls up -d --build ─────────────
  # Caddy сам получает сертификат Let's Encrypt для CRM_DOMAIN и проксирует на CRM.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: karkascrm-caddy
    restart: unless-stopped
    depends_on:
      crm:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    entrypoint: ["/bin/sh", "/etc/caddy/start.sh"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # домен обязателен для профиля tls: CRM_DOMAIN=crm.вашдомен.ru в .env
      CRM_DOMAIN: "${CRM_DOMAIN:-}"
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/start-caddy.sh:/etc/caddy/start.sh:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crm_data:
    name: karkascrm_data
  caddy_data:
    name: karkascrm_caddy_data
  caddy_config:
    name: karkascrm_caddy_config
